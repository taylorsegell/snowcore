<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snowflake Practice Tests</title>
  <meta name="description" content="Offline-friendly Snowflake practice tests with progress tracking" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Theme colors -->
  <meta name="theme-color" content="#74C1C2" />
  <meta name="background-color" content="#00121C" />

  <!-- iOS-specific PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Snowflake Quiz" />

  <!-- iOS app icons -->
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <button id="back-to-landing" class="ghost back-btn" style="display: none;">← Back to tests</button>
      <h1>Snowflake Practice Tests</h1>
      <p class="muted">Offline-friendly, progress saved locally</p>
    </div>
    <div class="controls">
      <label>
        <select id="test-filter"></select>
      </label>
      <label class="toggle">
        <input type="checkbox" id="review-toggle" />
        <span>Review mistakes only</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="flagged-toggle" />
        <span>Flagged for review</span>
      </label>
      <button id="export-mistakes" class="ghost">Export mistakes CSV</button>
      <button id="export-flagged" class="ghost">Export flagged CSV</button>
      <button id="reset-progress" class="ghost">Reset progress</button>
    </div>
  </header>

  <section id="landing" class="card">
    <div class="card-top">
      <div class="badge">Pick a test</div>
      <div class="muted">Start anywhere, progress is saved</div>
    </div>
    <div id="landing-grid" class="landing-grid"></div>
  </section>

  <main id="quiz-view" class="hidden">
    <section class="stats">
      <div><span id="stat-attempted">0</span><small>Attempted</small></div>
      <div><span id="stat-correct">0</span><small>Correct</small></div>
      <div><span id="stat-incorrect">0</span><small>Incorrect</small></div>
      <div><span id="stat-streak">0</span><small>Streak</small></div>
      <div><span id="stat-total-attempts">0</span><small>Total Attempts</small></div>
    </section>

    <section class="card question-overview-card">
      <div class="card-top collapsible-header" id="question-overview-header">
        <div>
          <div class="badge">Question Overview</div>
          <div class="muted">Click to jump • Green = correct first try • Red = incorrect</div>
        </div>
        <button class="collapse-toggle" id="grid-collapse-toggle" aria-label="Toggle question grid">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
          </svg>
        </button>
      </div>
      <div id="question-grid" class="question-grid"></div>
    </section>

    <div class="progress">
      <div id="progress-bar"></div>
      <div class="progress-label" id="progress-label">0 / 0</div>
    </div>

    <section id="question-card" class="card">
      <div class="card-top">
        <div class="badge" id="question-meta">Loading…</div>
        <div class="test-pill" id="test-pill"></div>
      </div>
      <h2 id="question-text">Loading question…</h2>
      <form id="options"></form>
      <div class="actions">
        <button type="button" id="prev">Previous</button>
        <button type="button" id="check">Check answer</button>
        <button type="button" id="next">Next</button>
        <button type="button" id="retry" class="ghost">Retry</button>
      </div>
      <div class="flag-actions">
        <button type="button" id="flag-review" class="flag-btn" title="Flag for personal review (got it right but want to review)">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path d="M3 6a3 3 0 013-3h10a1 1 0 01.8 1.6L14.25 8l2.55 3.4A1 1 0 0116 13H6a1 1 0 00-1 1v3a1 1 0 11-2 0V6z"/>
          </svg>
          <span>Review later</span>
        </button>
        <button type="button" id="flag-broken" class="flag-btn" title="Report incorrect question, broken link, or wrong explanation">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <span>Report issue</span>
        </button>
      </div>
      <div id="feedback" class="feedback"></div>
      <div id="explanation" class="explanation"></div>
    </section>
  </main>

  <script src="questions-data.js"></script>
  <script type="module" src="app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('ServiceWorker registration successful:', registration.scope);
          })
          .catch((error) => {
            console.log('ServiceWorker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
